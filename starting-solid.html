<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sai’s First Foods · 宝宝辅食</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ec;--w1:#cfe3d4;--w2:#f3d9d0;--card:#fffdf8;--ink:#26322d;--mute:#66736c;--line:#dfdbcf;--ac:#2f6b5e;--aci:#fff;--al:#8a4a6b;--alb:#f3e4ec;--ok:#e3efe5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17201c;--w1:#243a30;--w2:#3a2a2d;--card:#202b26;--ink:#e8efe9;--mute:#9fb0a6;--line:#33433b;--ac:#7cc4b0;--aci:#10231d;--al:#e3a6c4;--alb:#3b2832;--ok:#25382e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17201c;--w1:#243a30;--w2:#3a2a2d;--card:#202b26;--ink:#e8efe9;--mute:#9fb0a6;--line:#33433b;--ac:#7cc4b0;--aci:#10231d;--al:#e3a6c4;--alb:#3b2832;--ok:#25382e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Work Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;background-image:radial-gradient(60% 40% at 15% 0%,var(--w1),transparent 70%),radial-gradient(55% 35% at 95% 8%,var(--w2),transparent 70%);background-repeat:no-repeat;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:0 18px 24px}
h1,h2,h3{font-family:Fraunces,"Noto Serif SC","Songti SC",serif;font-weight:600;margin:0;line-height:1.25}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 0 12px}
h1{font-size:1.5rem}
.sub{color:var(--mute);font-size:.86rem;margin-top:2px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:none;color:var(--mute);padding:7px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ac);color:var(--aci)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daynav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.2rem;cursor:pointer}
.daynav button:disabled{opacity:.35}
.daynum{text-align:center}.daynum b{font-family:Fraunces,serif;font-size:2.3rem;display:block;line-height:1}.daynum span{color:var(--mute);font-size:.85rem}
.meal{font-family:Fraunces,"Noto Serif SC",serif;font-size:1.22rem;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--ok);border:1px solid var(--line)}
.chip.al{background:var(--alb);color:var(--al);border-color:transparent;font-weight:500}
.alert{border-left:4px solid var(--al);background:var(--alb);border-radius:12px;padding:12px 14px;margin:12px 0}
.alert h3{font-size:1.05rem;color:var(--al);margin-bottom:4px}.alert p{margin:6px 0 0;font-size:.92rem}
.lbl{font-weight:600;font-size:.9rem;margin:12px 0 2px}
.txt{margin:0;font-size:.93rem}
.hint{font-size:.88rem;color:var(--mute);margin:6px 0 0}
.ref{font-size:.82rem;color:var(--mute);margin-top:10px}
.seg{display:flex;gap:8px;margin:4px 0 8px}
.seg button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--aci);border-color:var(--ac)}
.grp{font-family:Fraunces,"Noto Serif SC",serif;font-size:1.05rem;margin:16px 0 4px}
.item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{width:22px;height:22px;margin-top:2px;accent-color:var(--ac);flex:none}
.item label{flex:1;cursor:pointer}.item small{display:block;color:var(--mute);font-size:.82rem}
.item.done label{text-decoration:line-through;color:var(--mute)}
.add{display:flex;gap:8px;margin-top:14px}
.add input,textarea,.dt{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.add input{flex:1;min-width:0}
textarea{width:100%;min-height:78px;resize:vertical}
.add button{padding:10px 16px;border-radius:12px;border:0;background:var(--ac);color:var(--aci);font:inherit;font-weight:500;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center}
.cal .wd{font-size:.75rem;color:var(--mute)}
.cal button{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:none;color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;position:relative}
.cal button.has{background:var(--ok);border-color:var(--line);font-weight:600}
.cal button.sel{outline:2px solid var(--ac)}
.cal button i{position:absolute;bottom:3px;left:0;right:0;font-style:normal;font-size:.6rem;color:var(--ac)}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:12px 2px 10px;font:inherit;font-size:.78rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:1.25rem}nav button[aria-current=page]{color:var(--ac);font-weight:600}
footer{color:var(--mute);font-size:.78rem;margin-top:22px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>

 [["Produce","蔬果"],[["Apple","苹果","1 whole · any variety","1 个 · 任意品种"],["Bell pepper","甜椒","1 whole · any variety","1 个 · 任意品种"],["Corn on the cob","玉米棒","1 ear · fresh or frozen","1 根 · 新鲜或冷冻"],["Lemon","柠檬","1 whole · any variety","1 个 · 任意品种"],["Mango, ripe","熟芒果","1 whole · fresh, not frozen; banana as substitute","1 个 · 新鲜而非冷冻；可用香蕉代替"]]],
 [["Check for leftovers","先看看有没有剩的"],[["Broccoli florets","西兰花小朵","½ cup (120 ml)","½ 杯（120 毫升）"],["Cauliflower florets","花椰菜小朵","1 cup (240 ml)","1 杯（240 毫升）"],["Instant oatmeal","即食燕麦","½ cup (96 g)","½ 杯（96 克）"],["Hulled hemp seeds, optional","去壳火麻仁（可选）","2 tsp (6 g) · or chia, or finely ground pumpkin or sunflower seeds","2 茶匙（6 克）· 或奇亚籽、磨细的南瓜籽或葵花籽"],["Olive oil","橄榄油","⅓ cup (75 ml)","⅓ 杯（75 毫升）"]]]]

var P=[
[["Steamed broccoli florets","蒸西兰花小朵"],1,[5,9],3,18],
[["Steamed cauliflower florets","蒸花椰菜小朵"],3,[5,8,13],3,20],

function pg(d){return d<=7?17+d:21+d}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){try{localStorage.setItem("ff2",JSON.stringify({L:L,DAY:DAY,CHK:CHK,CUS:CUS,LOG:LOG}))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem("ff2")||"null");if(s){L=s.L||"e";DAY=s.DAY||1;CHK=s.CHK||{};CUS=s.CUS||[];LOG=s.LOG||{}}}catch(e){}SEL=ymd(new Date())}
function ent(d){if(!LOG[d])LOG[d]={d:ymd(new Date()),p:0,t:{},w:0,x:0,n:""};return LOG[d]}
function seg(){var h='<div class="seg">';[1,2].forEach(function(w){h+='<button aria-pressed="'+(WK===w)+'" onclick="setWk('+w+')">'+(L==="z"?"第 "+w+" 周":"Week "+w)+'</button>'});return h+'</div>'}
function todayView(){
 var d=D[DAY-1],e=LOG[DAY]||{t:{}},h="";
 h+='<div class="card"><div class="daynav"><button aria-label="'+t(UI.prev)+'" onclick="go(-1)"'+(DAY<=1?" disabled":"")+'>‹</button><div class="daynum"><span>'+t(UI.day)+'</span><b>'+DAY+'</b><span>'+t(UI.of)+'</span></div><button aria-label="'+t(UI.next)+'" onclick="go(1)"'+(DAY>=14?" disabled":"")+'>›</button></div></div>';
 if(d[2].length&&DAY===[8,14].filter(function(x){return x===DAY})[0]){h+='<div class="alert" role="note"><h3>'+t(UI.newal)+': '+t(AL[d[2][0]])+'</h3><p>'+t(UI.a1)+'</p><p>'+t(UI.a2)+'</p><p>'+t(UI.a3)+'</p><p>'+t(UI.a4)+'</p></div>'}
 h+='<div class="card"><div class="meal">'+t(d[0])+'</div>';
 if(/two ways/i.test(d[0][0]))h+='<p class="hint">'+t(UI.two)+'</p>';
 if(d[3].length)h+='<div class="lbl">'+t(UI.newf)+'</div><div class="chips">'+d[3].map(function(f){return'<span class="chip">'+esc(t(F[f]))+'</span>'}).join("")+'</div>';
 if(d[2].length)h+='<div class="lbl">'+t(UI.als)+'</div><div class="chips">'+d[2].map(function(a){return'<span class="chip al">'+t(AL[a])+'</span>'}).join("")+'</div>';
 h+='<div class="lbl">'+t(UI.serve)+'</div><p class="txt">'+t(d[4])+'</p><div class="lbl">'+t(UI.store)+'</div><p class="txt">'+t(d[5])+'</p><div class="ref">'+t(UI.book)+' '+pg(DAY)+t(UI.pgz)+'</div></div>';
 h+='<div class="card"><h3>'+t(UI.ck)+'</h3>';
 h+='<div class="item'+(e.p?" done":"")+'"><input type="checkbox" id="kp"'+(e.p?" checked":"")+' onchange="setF(\'p\')"><label for="kp">'+t(UI.prepd)+'</label></div>';
 h+='<div class="lbl">'+t(UI.tried)+'</div>';
 d[1].forEach(function(f){var on=e.t&&e.t[f];h+='<div class="item'+(on?" done":"")+'"><input type="checkbox" id="kt'+f+'"'+(on?" checked":"")+' onchange="setT(\''+f+'\')"><label for="kt'+f+'">'+esc(t(F[f]))+'</label></div>'});
 if(d[6])h+='<div class="item'+(e.w?" done":"")+'"><input type="checkbox" id="kw"'+(e.w?" checked":"")+' onchange="setF(\'w\')"><label for="kw">'+t(UI.watch)+'</label></div>';
 if(d[7])h+='<div class="item'+(e.x?" done":"")+'"><input type="checkbox" id="kx"'+(e.x?" checked":"")+' onchange="setF(\'x\')"><label for="kx">'+t(UI.ten)+'</label></div>';
 h+='<div class="lbl">'+t(UI.date)+'</div><input class="dt" type="date" value="'+(e.d||ymd(new Date()))+'" onchange="setDate(this.value)">';
 h+='<div class="lbl">'+t(UI.note)+'</div><textarea placeholder="'+esc(t(UI.notep))+'" onchange="setNote(this.value)">'+esc(e.n||"")+'</textarea></div>';
 return h
}
function byDate(){var m={};Object.keys(LOG).forEach(function(k){var e=LOG[k];if(Object.keys(e.t||{}).length||e.n){(m[e.d]=m[e.d]||[]).push(+k)}});return m}
function calView(){
 var loc=L==="z"?"zh-CN":"en-US",n=new Date(),b=new Date(n.getFullYear(),n.getMonth()+CM,1),y=b.getFullYear(),mo=b.getMonth(),by=byDate(),h="";
 h+='<div class="card"><div class="mh"><button aria-label="‹" onclick="mv(-1)">‹</button><h3>'+b.toLocaleDateString(loc,{year:"numeric",month:"long"})+'</h3><button aria-label="›" onclick="mv(1)">›</button></div><div class="cal">';
 for(var i=0;i<7;i++)h+='<div class="wd">'+new Date(2023,0,1+i).toLocaleDateString(loc,{weekday:"narrow"})+'</div>';
 for(i=0;i<b.getDay();i++)h+='<div></div>';
 for(var dd=1;dd<=new Date(y,mo+1,0).getDate();dd++){var k=y+"-"+pad(mo+1)+"-"+pad(dd),c=by[k]?by[k].reduce(function(s,x){return s+Object.keys(LOG[x].t||{}).length},0):0;
  h+='<button class="'+(by[k]?"has":"")+(k===SEL?" sel":"")+'" onclick="pick(\''+k+'\')">'+dd+(c?'<i>'+c+'</i>':'')+'</button>'}
 h+='</div></div><div class="card"><h3>'+SEL+'</h3>';
 if(by[SEL])by[SEL].forEach(function(x){var e=LOG[x];h+='<div class="lbl">'+t(UI.pd)+' '+x+t(UI.pdz)+'</div><div class="chips">'+Object.keys(e.t||{}).map(function(f){return'<span class="chip">'+esc(t(F[f]))+'</span>'}).join("")+'</div>'+(e.n?'<p class="txt">'+esc(e.n)+'</p>':'')});
 else h+='<p class="hint">'+t(UI.none)+'</p>';
 h+='</div>';
 var first={};Object.keys(LOG).sort(function(a,b){return LOG[a].d<LOG[b].d?-1:1}).forEach(function(k){Object.keys(LOG[k].t||{}).forEach(function(f){if(!first[f])first[f]=LOG[k].d})});
 var ks=Object.keys(first);
 h+='<div class="card"><h3>'+t(UI.mon)+' · '+ks.length+'</h3>'+(ks.length?'<div class="chips">'+ks.map(function(f){return'<span class="chip">'+esc(t(F[f]))+' · '+first[f].slice(5)+'</span>'}).join("")+'</div>':'<p class="hint">'+t(UI.emp)+'</p>')+'</div>';
 return h
}
function groceryView(){
 var h=seg()+'<p class="hint">'+t(UI["gn"+WK])+'</p><div class="card" style="padding-top:2px">';
 G[WK].forEach(function(g,gi){h+='<div class="grp">'+t(g[0])+'</div>';g[1].forEach(function(it,ii){var id="g"+WK+"-"+gi+"-"+ii,on=CHK[id];
  h+='<div class="item'+(on?" done":"")+'"><input type="checkbox" id="'+id+'"'+(on?" checked":"")+' onchange="tog(\''+id+'\')"><label for="'+id+'">'+esc(L==="z"?it[1]:it[0])+'<small>'+esc(L==="z"?it[3]:it[2])+'</small></label></div>'})});
 var mine=CUS.filter(function(c){return c.w===WK});
 if(mine.length){h+='<div class="grp">'+t(UI.mine)+'</div>';mine.forEach(function(c){var id="c"+c.id,on=CHK[id];h+='<div class="item'+(on?" done":"")+'"><input type="checkbox" id="'+id+'"'+(on?" checked":"")+' onchange="tog(\''+id+'\')"><label for="'+id+'">'+esc(c.n)+'</label></div>'})}
 return h+'</div><div class="add"><input id="newItem" placeholder="'+esc(t(UI.add))+'" onkeydown="if(event.key===\'Enter\')addIt()"><button onclick="addIt()">'+t(UI.addb)+'</button></div>'
}
function prepView(){
 var h='<p class="hint">'+t(UI.pi)+'</p>';
 P.forEach(function(p){h+='<div class="card"><h3>'+t(p[0])+'</h3><div class="chips"><span class="chip">'+t(UI.mk)+' '+p[1]+'</span><span class="chip">'+t(UI.fridge)+': '+p[3]+(L==="z"?" 天":" days")+(p[3]===3?" · "+t(UI.freeze)+": 2 "+(L==="z"?"个月":"months"):"")+'</span></div><div class="lbl">'+t(UI.ru)+'</div><div class="chips">'+p[2].map(function(r){var g=r-p[1],ok=g<=p[3];return'<span class="chip'+(ok?"":" al")+'">'+(L==="z"?"第 "+r+" 天":"Day "+r)+' · '+(L==="z"?g+" 天后":"+"+g+"d")+' · '+t(ok?UI.fr:UI.fz)+'</span>'}).join("")+'</div><div class="ref">'+t(UI.book)+' '+p[4]+t(UI.pgz)+'</div></div>'});
 return h
}
function render(){
 document.documentElement.lang=L==="z"?"zh":"en";
 var v=TAB==="today"?todayView():TAB==="cal"?calView():TAB==="grocery"?groceryView():prepView();
 document.getElementById("app").innerHTML='<header><div><h1>'+t(UI.title)+'</h1><div class="sub">'+t(UI.sub)+'</div></div><div class="lang" role="group" aria-label="Language"><button aria-pressed="'+(L==="e")+'" onclick="setL(\'e\')">EN</button><button aria-pressed="'+(L==="z")+'" onclick="setL(\'z\')">中文</button></div></header>'+((TAB==="grocery")?seg():"")+v.replace(/^<div class="seg">.*?<\/div>/,"")+'<footer>'+t(UI.foot)+'</footer>';
 document.getElementById("tabs").innerHTML=[["today","🥣"],["cal","📅"],["grocery","🛒"],["prep","🍳"]].map(function(x){return'<button aria-current="'+(TAB===x[0]?"page":"false")+'" onclick="setTab(\''+x[0]+'\')"><span class="i">'+x[1]+'</span>'+t(UI[x[0]])+'</button>'}).join("");
}
function go(n){DAY=Math.max(1,Math.min(14,DAY+n));save();render()}
function setL(l){L=l;save();render()}
function setTab(x){TAB=x;render();window.scrollTo(0,0)}
function setWk(w){WK=w;render()}
function tog(id){CHK[id]=!CHK[id];save();render()}
function addIt(){var el=document.getElementById("newItem"),v=el.value.trim();if(!v)return;CUS.push({id:Date.now(),n:v,w:WK});save();render()}
function setF(k){var e=ent(DAY);e[k]=e[k]?0:1;save();render()}
function setT(f){var e=ent(DAY);if(e.t[f])delete e.t[f];else e.t[f]=1;save();render()}
function setDate(v){if(!v)return;ent(DAY).d=v;save();render()}
function setNote(v){ent(DAY).n=v;save()}
function mv(n){CM+=n;render()}
function pick(k){SEL=k;render()}
load();render();
</script>
