function openBookPage(page){if(!PDF){pendingBookPage=page;document.getElementById('localBook').click();return;}window.open(pageUrl(page),'_blank','noopener');}
function loadBook(file){if(!file)return;if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){alert('Please select a PDF.');return;}if(PDF)URL.revokeObjectURL(PDF);PDF=URL.createObjectURL(file);draw();window.open(pageUrl(pendingBookPage),'_blank','noopener');}
const bookFrame=page=>PDF?`<iframe title="Purchased feeding guide" class="pdf-preview" loading="lazy" src="${pageUrl(page)}"></iframe>`:`<div class="book-placeholder"><strong>${tr('Open your purchased guide','打开已购买的原书')}</strong><p>${tr('Select the PDF from your device. It stays in this browser session; the book is never uploaded to this public website.','从设备中选择 PDF。原书仅在当前浏览器中打开，不会上传到公开网站。')}</p><button class="btn primary" onclick="openBookPage(${page})">${tr('Choose PDF','选择 PDF')}</button></div>`;

const saved=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}};
const log=d=>(state.log[d]??={foods:{},prepared:false,served:false,notes:'',date:''});
const niceDate=d=>{if(!state.start)return '';let x=new Date(state.start+'T12:00:00');x.setDate(x.getDate()+d-1);return x.toLocaleDateString(zh()?'zh-CN':'en-US',{month:'short',day:'numeric',year:'numeric'})};
const tabs=[['today','🥣','Today','今天'],['plan','📅','100 days','100天'],['grocery','🛒','Groceries','采购'],['guide','📖','Book','原书'],['settings','⚙️','Family data','家庭数据']];
function switchTab(t){state.tab=t;saved();draw();scrollTo(0,0)}function setLang(l){state.lang=l;saved();draw()}function dayChange(d){state.day=Math.max(1,Math.min(100,d));state.week=weekFor(state.day);saved();draw()}function weekChange(w){state.week=+w;saved();draw()}
function toggle(k){state.checked[k]=!state.checked[k];saved();draw()}function field(k,v){log(state.day)[k]=v;saved()}function logFood(d,i){const o=log(d);o.foods[i]=!o.foods[i];saved();draw()}function completeDay(d){log(d).served=!log(d).served;saved();draw()}
function weekSelect(){return `<select class="weekSelect" onchange="weekChange(this.value)">${Array.from({length:14},(_,i)=>`<option value="${i+1}" ${state.week===i+1?'selected':''}>${weekName(i+1)}</option>`).join('')}</select>`}
function draw(){document.documentElement.lang=state.lang;document.getElementById('len').classList.toggle('active',!zh());document.getElementById('lzh').classList.toggle('active',zh());document.getElementById('headerdesc').textContent=tr('A little food adventure, one day at a time.','一口一口，探索世界的味道。');let total=DATA.days.filter(d=>state.log[d.day]?.served).length;
document.getElementById('stDays').innerHTML=`<strong>100</strong> ${tr('days indexed','天计划')}`;document.getElementById('stDone').innerHTML=`<strong>${total}</strong> ${tr('days served','天已完成')}`;document.getElementById('stWeek').innerHTML=`<strong>${weekName(weekFor(state.day))}</strong>`;
const nav=tabs.map(([key,ic,en,cn])=>`<button class="${state.tab===key?'active':''}" onclick="switchTab('${key}')"><span class="hideSmall">${ic}</span> ${tr(en,cn)}</button>`).join('');document.getElementById('sideNav').innerHTML=nav;document.getElementById('mobileNav').innerHTML=tabs.map(([key,ic,en,cn])=>`<button class="${state.tab===key?'active':''}" onclick="switchTab('${key}')"><i>${ic}</i>${tr(en,cn)}</button>`).join('');
document.getElementById('content').innerHTML=({today:todayView,plan:planView,grocery:groceryView,guide:guideView,settings:settingsView})[state.tab]();document.getElementById('foot').textContent=tr('Private family companion to the purchased Solid Starts First 100 Days guide. Not affiliated with Solid Starts. Consult your pediatrician for feeding or allergy concerns.','家庭私人辅食计划工具，配合已购买的 Solid Starts《First 100 Days》使用；与 Solid Starts 无关联。喂养或过敏问题请咨询儿科医生。')}
function todayView(){let d=dayObj(state.day),e=log(state.day),list=d.meals||[],page=d.pages[0],detail=state.day<=14?tr('Follow the original book for complete recipes, serving sizes, food preparation and storage instructions.','完整食谱、份量、食材处理方法与保存说明请查看原书。'):tr('Full instructions are available in the original book, linked below.','完整制作和喂食说明请点击下方原书页面。');return `<div class="panel"><div class="controls"><button class="btn" ${state.day===1?'disabled':''} onclick="dayChange(${state.day-1})">← ${tr('Previous','上一天')}</button><span class="daylabel">${weekName(weekFor(state.day))} · ${niceDate(state.day)||tr('At your own pace','按自己的节奏')}</span><button class="btn" ${state.day===100?'disabled':''} onclick="dayChange(${state.day+1})">${tr('Next','下一天')} →</button></div><h2 class="daytitle">${tr('Day','第')} ${state.day}${zh()?' 天':''}</h2><p class="quiet">${tr('Recipes begin on page','食谱起始页')} ${page}. ${d.pages.length>1?tr('Multiple pages / meals today.','今天包含多页或多餐。'):''}</p>${list.map((m,i)=>`<div class="meal"><div class="row"><h3>${esc(m)}</h3><span class="subtle">${tr('Meal','餐次')} ${i+1}</span></div></div>`).join('')}${!list.length?'<p>See the PDF page for today.</p>':''}<div class="notice">${detail}</div><div class="row">${link(page,tr('Open today’s recipes','查看今天的完整食谱'),true)} ${d.pages.length>1?`<span class="subtle">${tr('Pages','页码')}: ${d.pages.join(', ')}</span>`:''}</div></div>
<div class="panel"><h2>${tr('Our food diary','宝宝饮食日记')}</h2><label class="checkline ${e.prepared?'done':''}"><input type="checkbox" ${e.prepared?'checked':''} onchange="field('prepared',this.checked);draw()"><span>${tr('Ingredients prepared','食材已备好')}</span></label><label class="checkline ${e.served?'done':''}"><input type="checkbox" ${e.served?'checked':''} onchange="completeDay(${state.day})"><span>${tr('Meal served / day completed','已喂食 / 本日完成')}</span></label><label class="field"><span>${tr('Date actually served','实际喂食日期')}</span><input type="date" value="${esc(e.date||niceIso(state.day))}" onchange="field('date',this.value)"></label><label class="field"><span>${tr('Notes, allergies, reactions, enjoyment, substitutions','备注：过敏反应、喜好、替换食材等')}</span><textarea id="notes" oninput="field('notes',this.value)" placeholder="${tr('What did Sai try? How did it go?','小飒一吃了什么？有什么反应？')}">${esc(e.notes)}</textarea></label></div><div class="panel"><h2>${tr('Original book pages','原书页面')}</h2><p class="quiet">${tr('Choose the purchased PDF from your device to read it here. It is not hosted on this public site.','请从设备选择已购买的 PDF 以查看内容；文件不存放在公开网站上。')}</p>${bookFrame(page)}</div>`}
function niceIso(d){if(!state.start)return '';const x=new Date(state.start+'T12:00:00');x.setDate(x.getDate()+d-1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function planView(){let range=DATA.days.filter(d=>weekFor(d.day)===state.week);let matches=range;return `<div class="panel"><div class="row"><h2>${tr('The full 100-day plan','完整100天辅食计划')}</h2>${weekSelect()}</div><p class="quiet">${tr('Every day is indexed to the actual pages in your book. Choose any day.','每一天都已对应原书页码。点击即可查看。')}</p><div class="progress"><div style="width:${DATA.days.filter(d=>state.log[d.day]?.served).length}%"></div></div><div class="weekgrid">${matches.map(d=>`<button class="daytile ${state.day===d.day?'active':''} ${state.log[d.day]?.served?'complete':''}" onclick="state.day=${d.day};switchTab('today')"><div class="tiny">${tr('DAY','第')} ${d.day}</div><div class="num">${state.log[d.day]?.served?'✓':'○'}</div><div class="tiny">${esc((d.meals[0]||'View recipes').slice(0,38))}</div></button>`).join('')}</div></div><div class="panel"><h2>${tr('Jump to any day','跳转到任意一天')}</h2><div class="row"><input aria-label="Day number" style="max-width:130px" class="search" type="number" min="1" max="100" id="jumpDay" placeholder="1–100"><button class="btn primary" onclick="dayChange(+document.getElementById('jumpDay').value||1);switchTab('today')">${tr('Go to day','跳转')}</button></div><p class="quiet">${tr('Tip: a missed day is fine. You can return to any previous recipe or repeat it.','提醒：漏掉某一天没关系，可以重做此前任何一道辅食。')}</p></div>`}
function groceryView(){let w=DATA.weeks[String(state.week)],items=w.grocery||[],groups=[...new Set(items.map(x=>x.category))],done=items.filter((_,i)=>state.checked['g'+state.week+'-'+i]).length;const custom=state.custom[state.week]||[];return `<div class="panel"><div class="row"><h2>${tr('Weekly groceries','每周采购清单')}</h2>${weekSelect()}</div><p class="quiet">${tr('Items and quantities extracted from your purchased guide. Check the book for substitutions and notes.','食材和数量摘自原书。替代选择及详细说明请查看原书。')}</p><div class="row">${w.ingredientPages.map(p=>link(p,tr('Ingredient list p.','食材清单第')+p)).join(' ')}<span class="quiet">${done}/${items.length} ${tr('checked','已勾选')}</span></div>${groups.map(g=>`<div class="grocerygroup">${esc(g)}</div>${items.map((x,i)=>x.category===g?`<label class="checkline ${state.checked['g'+state.week+'-'+i]?'done':''}"><input type="checkbox" ${state.checked['g'+state.week+'-'+i]?'checked':''} onchange="toggle('g${state.week}-${i}')"><span>${esc(x.name)} <small class="quiet">· ${esc(x.quantity)}</small></span></label>`:'').join('')}`).join('')}<div class="grocerygroup">${tr('Our extras','家里额外需要买')}</div>${custom.map((x,i)=>`<label class="checkline ${state.checked['c'+state.week+'-'+i]?'done':''}"><input type="checkbox" ${state.checked['c'+state.week+'-'+i]?'checked':''} onchange="toggle('c${state.week}-${i}')"><span>${esc(x)}</span></label>`).join('')}<div class="row" style="margin-top:15px"><input class="search" style="flex:1" id="extraItem" placeholder="${tr('Add an item','添加食材')}" onkeydown="if(event.key==='Enter')addExtra()"><button class="btn primary" onclick="addExtra()">+</button></div></div>`}
function addExtra(){let el=document.getElementById('extraItem');let v=el.value.trim();if(v){(state.custom[state.week]??=[]).push(v);saved();draw()}}
function guideView(){return `<div class="panel"><h2>${tr('Your complete book','完整原书')}</h2><p class="quiet">${tr('Choose the purchased book PDF from your device to see the full recipes, safety guidance, and preparation instructions.','从设备中选择已购买的 PDF，即可查阅完整食谱、安全及备餐说明。')}</p><div class="row">${link(1,tr('Open all 287 pages','打开完整287页'),true)} ${link(4,tr('Table of contents','目录'))}</div><div class="sectionbar">${weekSelect()} ${link(DATA.weeks[String(state.week)].overviewPage,tr('Week overview','本周概览'))}</div>${bookFrame(4)}</div><div class="mutebanner">${tr('This public GitHub Pages site does not store the purchased book. Keep the PDF on your own devices or in a private authenticated storage service.','公开的 GitHub Pages 网站不会储存购买的原书。请将 PDF 保存在自己的设备或需要登录的私人储存空间。')}</div>`}
function settingsView(){return `<div class="panel"><h2>${tr('Our family settings','家庭设置')}</h2><label class="field"><span>${tr('Day 1 start date (optional)','第1天的开始日期（可选）')}</span><input type="date" value="${esc(state.start)}" onchange="state.start=this.value;saved();draw()"></label><p class="quiet">${tr('The day count follows your own pace; dates are just a reference.','按宝宝自己的节奏进行，日期仅供参考。')}</p><h3 style="margin-top:25px">${tr('Back up or transfer progress','备份或转移进度')}</h3><p class="quiet">${tr('For now, progress lives in this browser only. Sid and grandparents will not automatically see your checkmarks. Export your progress and import it on another device to transfer it.','目前数据只保存在当前浏览器中；Sid 和祖辈不会自动同步勾选记录。可导出文件后在其他设备导入。')}</p><div class="row"><button class="btn primary" onclick="exportData()">${tr('Export family progress','导出家庭进度')} ↓</button><label class="btn">${tr('Import a backup','导入备份')} ↑<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"></label></div><div class="notice warn">${tr('Real-time shared progress requires a database and sign-in (for example, Supabase or Firebase). This offline companion does not provide live synchronization.','真正的多人实时同步需要登录和数据库（如 Supabase 或 Firebase）。本版本无法实时同步。')}</div></div>`}
function exportData(){const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),app:'sai-first-foods',state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sai-food-diary-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(file){if(!file)return;file.text().then(x=>{const o=JSON.parse(x);if(!o.state||!o.state.log||!o.state.checked)throw Error('invalid');if(!confirm(tr('Replace this browser’s progress with the backup?','使用备份替换当前浏览器的数据？')))return;state={...state,...o.state};saved();draw()}).catch(()=>alert(tr('Could not read this backup.','无法读取备份文件。')))}
draw();</script></body></html>
