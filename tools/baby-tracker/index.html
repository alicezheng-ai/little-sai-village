<style>
  /* Form Layout Polish & Safety Overflow Guards */
  .row-active {
    background: rgba(255, 255, 255, 0.65);
    border-radius: 14px;
    padding: 16px !important;
    margin: 8px 0;
    box-shadow: inset 0 0 0 1px var(--paper-line, #e3d9c4);
  }

  .form-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    box-sizing: border-box;
  }

  .form-row-2col {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    width: 100%;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    box-sizing: border-box;
    min-width: 0;
  }

  .form-group label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-soft, #6b5e52);
  }

  .form-control {
    width: 100%;
    box-sizing: border-box;
    min-width: 0;
    max-width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--paper-line, #d4c8b3);
    border-radius: 8px;
    background: #fff;
    font-family: inherit;
    font-size: 0.9rem;
  }

  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--paper-line, #d4c8b3);
    background: #fff;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .chip-btn.active {
    background: var(--rose-deep, #a35252);
    color: #fff;
    border-color: var(--rose-deep, #a35252);
  }

  .tag-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    font-size: 0.72rem;
    border-radius: 12px;
    background: var(--gold-soft, #f2e3c6);
    color: var(--ink, #332a24);
    font-weight: normal;
    text-transform: lowercase;
  }

  .actions-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,0.06);
  }

  .actions-right {
    display: flex;
    gap: 8px;
  }

  /* Running timers and forms must stack vertically. The shared .row class
     lays its children out in a horizontal flex row, and the idle state also
     sets an inline display:flex that survived into the active state, so the
     timer and the Wake Up / Stop button were pushed off the right edge. */
  .row.row-active {
    display: block !important;
  }
  .row-active-top {
    flex-wrap: wrap;
    gap: 8px;
  }
  .row-active .time-input {
    max-width: 100%;
  }
  .row-active-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row-timer {
    max-width: 100%;
  }

  /* The shared .hero class is sized for the homepage's big photo hero; this
     page only has a title and an age pill. */
  header.hero,
  header.hero .hero__inner {
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    min-height: 0 !important;
  }
  header.hero {
    margin-top: 0 !important;
  }
  header.hero h1 {
    margin-top: 0;
  }

  /* In home-screen mode the page draws under the iOS status bar. */
  .site-nav {
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px) !important;
  }

  /* Growth & temp: a value box with its unit picker beside it */
  .input-with-unit {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .input-with-unit .form-control:first-child {
    flex: 1;
    min-width: 0;
  }
  .input-with-unit .unit-select {
    flex: 0 0 auto;
    width: 84px;
  }
</style>

<script>
(function(){

  // ---------- Configuration ----------
  var CONFIG = {
    APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxz-G6Mxu6IMxsnKE3noswcClorYMylOqrG6sFveYlcJNs0K4wx4EsFz_tEWwq1iNFD/exec",
    PROFILE_NAME: "Jujube",
    CAREGIVER: "Alice",
    TIMEZONE: "America/Los_Angeles",
    BIRTH_DATE: "2026-06-12"
  };
  var configured = !CONFIG.APPS_SCRIPT_URL.startsWith("PASTE_");

  // ---------- Storage keys ----------
  var K_TIMERS = 'jujube_timers_v2';
  var K_PENDING = 'jujube_pending_sync';
  var K_CACHE = 'jujube_recent_cache';
  var K_GROWTH = 'jujube_growth_cache';
  var K_CHART = 'jujube_chart_prefs';
  var K_UNITS = 'jujube_unit_prefs';
  var K_LAST = 'jujube_last_seen';

  // ---------- Transient UI state ----------
  var editing = null; 
  var currentSummaryRange = 'today';

  // ---------- Helpers ----------
  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function formatDateTime(ms){
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
           pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function formatTimeOnly(ms){
    var d = new Date(ms);
    var h = d.getHours();
    var m = pad(d.getMinutes());
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12;
    h = h ? h : 12;
    return h + ':' + m + ' ' + ampm;
  }

  function toLocalInputValue(ms){
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function fromLocalInputValue(str){
    var parts = str.split('T');
    var dateParts = parts[0].split('-').map(Number);
    var timeParts = (parts[1]||'00:00').split(':').map(Number);
    return new Date(dateParts[0], dateParts[1]-1, dateParts[2], timeParts[0], timeParts[1], 0).getTime();
  }

  function formatElapsed(totalSeconds){
    totalSeconds = Math.max(0, Math.floor(totalSeconds));
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    if (h > 0) return h + ':' + pad(m) + ':' + pad(s);
    return m + ':' + pad(s);
  }

  function formatDuration(totalSeconds){
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.round((totalSeconds % 3600) / 60);
    if (h > 0) return h + 'h ' + m + 'm';
    if (totalSeconds >= 60) return m + 'm';
    return totalSeconds + 's';
  }

  function formatRelative(ms){
    var diff = Math.max(0, Date.now() - ms);
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    var remMins = mins % 60;
    if (hrs < 24) return hrs + 'h ' + remMins + 'm ago';
    var days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  function computeAge(birthDateStr){
    var birth = new Date(birthDateStr + 'T00:00:00');
    var now = new Date();
    var months = (now.getFullYear() - birth.getFullYear()) * 12 + (now.getMonth() - birth.getMonth());
    var days = now.getDate() - birth.getDate();
    if (days < 0){
      months -= 1;
      var prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if (months <= 0) return days + (days === 1 ? ' day old' : ' days old');
    return months + ' mo ' + days + 'd';
  }

  function uid(){
    return 't-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---------- Local storage state ----------
  function getTimers(){ try { return JSON.parse(localStorage.getItem(K_TIMERS)) || {}; } catch(e){ return {}; } }
  function setTimers(t){ localStorage.setItem(K_TIMERS, JSON.stringify(t)); }

  function getPending(){ try { return JSON.parse(localStorage.getItem(K_PENDING)) || []; } catch(e){ return []; } }
  function setPending(list){ localStorage.setItem(K_PENDING, JSON.stringify(list)); }

  function getCache(){ try { return JSON.parse(localStorage.getItem(K_CACHE)) || []; } catch(e){ return []; } }
  function setCache(list){ localStorage.setItem(K_CACHE, JSON.stringify(list)); }

  function addCacheEntry(entry){
    var cache = getCache();
    cache.unshift(entry);
    setCache(cache.slice(0, 60));
  }
  function updateCacheEntry(key, entry){
    var cache = getCache();
    for (var i=0;i<cache.length;i++){
      if (cache[i]['_activityKey'] === key){ cache[i] = Object.assign({}, cache[i], entry); break; }
    }
    setCache(cache);
  }
  function removeCacheEntry(key){
    setCache(getCache().filter(function(e){ return e['_activityKey'] !== key; }));
  }
  function getLastFeedSide(){
    var cache = getCache();
    for (var i=0;i<cache.length;i++){
      if (cache[i]['Type'] === 'Breastfeed'){
        return cache[i]['[Breastfeed] End Side'] || cache[i]['[Breastfeed] Begin Side'] || null;
      }
    }
    return null;
  }

  // ---------- Growth & temperature ----------
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function toDateInputValue(ms){
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  function shortDate(ms){ var d = new Date(ms); return MONTHS[d.getMonth()] + ' ' + d.getDate(); }
  function numOrNull(v){
    if (v === '' || v === null || v === undefined) return null;
    var n = parseFloat(v);
    return isNaN(n) ? null : n;
  }
  function fmtField(v){ var n = numOrNull(v); return n === null ? '' : String(Math.round(n*100)/100); }
  function fmtVal(v){ return (Math.round(v*10)/10).toFixed(1); }

  function normUnit(u){
    u = String(u || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (u === 'LBS') u = 'LB';
    if (u === 'INCH' || u === 'INCHES') u = 'IN';
    if (u === 'FAHRENHEIT') u = 'F';
    if (u === 'CELSIUS') u = 'C';
    return u;
  }
  var UNIT_LABEL = { LB:'lb', KG:'kg', IN:'in', CM:'cm', F:'\u00b0F', C:'\u00b0C' };

  function convertValue(kind, v, fromUnit, toUnit){
    fromUnit = normUnit(fromUnit); toUnit = normUnit(toUnit);
    if (!fromUnit || fromUnit === toUnit) return v;
    if (kind === 'weight'){
      if (fromUnit === 'LB' && toUnit === 'KG') return v * 0.45359237;
      if (fromUnit === 'KG' && toUnit === 'LB') return v / 0.45359237;
    } else if (kind === 'height'){
      if (fromUnit === 'IN' && toUnit === 'CM') return v * 2.54;
      if (fromUnit === 'CM' && toUnit === 'IN') return v / 2.54;
    } else if (kind === 'temp'){
      if (fromUnit === 'F' && toUnit === 'C') return (v - 32) * 5 / 9;
      if (fromUnit === 'C' && toUnit === 'F') return v * 9 / 5 + 32;
    }
    return v;
  }

  // A sheet row is a growth point if it is a Growth row, or a Medical row that
  // carries a temperature and no medication (medication rows are Medicine doses).
  function entryToGrowthPoint(e){
    if (!e) return null;
    var type = e['Type'];
    var epoch = Number(e['Start Date/time (Epoch)']) || Date.parse(e['Start Date/time']);
    if (!epoch) return null;
    if (type === 'Growth'){
      var w = numOrNull(e['[Growth] Weight']), h = numOrNull(e['[Growth] Height']);
      if (w === null && h === null) return null;
      return { key: e['_activityKey'], epoch: epoch,
        weight: w, weightUnit: normUnit(e['[Growth] Weight Unit']) || 'LB',
        height: h, heightUnit: normUnit(e['[Growth] Height Unit']) || 'IN' };
    }
    if (type === 'Medical' && !e['[Medical] Medication']){
      var t = numOrNull(e['[Medical] Temperature']);
      if (t === null) return null;
      return { key: e['_activityKey'], epoch: epoch, temp: t, tempUnit: normUnit(e['[Medical] Temperature Unit']) || 'F' };
    }
    return null;
  }

  function getGrowthCache(){ try { return JSON.parse(localStorage.getItem(K_GROWTH)) || []; } catch(e){ return []; } }
  function setGrowthCache(list){ localStorage.setItem(K_GROWTH, JSON.stringify(list)); }
  function growthCacheUpsert(entry){
    var p = entryToGrowthPoint(entry);
    var list = getGrowthCache().filter(function(x){ return x.key !== entry['_activityKey']; });
    if (p) list.push(p);
    setGrowthCache(list);
  }
  function growthCacheRemove(key){
    setGrowthCache(getGrowthCache().filter(function(x){ return x.key !== key; }));
  }

  function getUnitPrefs(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem(K_UNITS)) || {}; } catch(e){}
    return { weight: p.weight || 'LB', height: p.height || 'IN', temp: p.temp || 'F' };
  }
  function setUnitPrefs(p){ localStorage.setItem(K_UNITS, JSON.stringify(p)); }

  var chartPrefs = (function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem(K_CHART)) || {}; } catch(e){}
    return { metric: p.metric || 'weight', system: p.system || 'imperial' };
  })();
  function saveChartPrefs(){ try { localStorage.setItem(K_CHART, JSON.stringify(chartPrefs)); } catch(e){} }

  function chartTarget(metric, system){
    if (metric === 'weight') return system === 'metric' ? 'KG' : 'LB';
    if (metric === 'height') return system === 'metric' ? 'CM' : 'IN';
    return system === 'metric' ? 'C' : 'F';
  }

  function growthSeries(metric, system){
    var target = chartTarget(metric, system);
    var out = [];
    getGrowthCache().forEach(function(p){
      var v = p[metric];
      if (v === null || v === undefined) return;
      out.push({ key: p.key, epoch: p.epoch, v: convertValue(metric, v, p[metric + 'Unit'], target) });
    });
    out.sort(function(a, b){ return a.epoch - b.epoch; });
    return out;
  }

  function applyPendingToGrowth(points){
    getPending().forEach(function(op){
      var key = op['_activityKey'];
      points = points.filter(function(x){ return x.key !== key; });
      if (op['_op'] === 'delete') return;
      var p = entryToGrowthPoint(op);
      if (p) points.push(p);
    });
    return points;
  }

  function applyGrowthEntries(entries){
    var pts = [];
    entries.forEach(function(e){ var p = entryToGrowthPoint(e); if (p) pts.push(p); });
    setGrowthCache(applyPendingToGrowth(pts));
    renderGrowthChart();
    renderGrowthRow();
  }

  // ---------- "Last logged" hints (Diaper, Bath) ----------
  function entryMs(e){ return Number(e['Start Date/time (Epoch)']) || Date.parse(e['Start Date/time']) || 0; }

  function lastKeyOf(e){
    var t = e['Type'];
    if (t === 'Sleep') return 'Sleep';
    if (t === 'Breastfeed') return 'Breastfeed';
    if (t === 'Bottle Feed') return 'Bottle Feed';
    if (t === 'Diaper') return 'Diaper';
    if (t === 'Routine' && e['[Routine] Routine'] === 'Bath') return 'Bath';
    if (t === 'Medical' && e['[Medical] Medication']) return 'Medicine';
    return null;
  }

  function getLastSeen(){ try { return JSON.parse(localStorage.getItem(K_LAST)) || {}; } catch(e){ return {}; } }
  function setLastSeen(m){ try { localStorage.setItem(K_LAST, JSON.stringify(m)); } catch(e){} }

  function deriveLast(entries){
    var out = {};
    entries.forEach(function(e){
      var key = lastKeyOf(e), ms = entryMs(e);
      if (!key || !ms) return;
      if (!out[key] || ms > out[key].epoch) out[key] = { epoch: ms, detail: e['[Diaper] Type'] || '' };
    });
    return out;
  }

  // Newest entry of a kind: the server's per-type "last" (reaches back past the
  // recent list) combined with anything newer in the local recent cache.
  function lastOf(key){
    var best = null, seen = getLastSeen()[key];
    if (seen && seen.epoch) best = { epoch: seen.epoch, detail: seen.detail || '' };
    getCache().forEach(function(e){
      if (lastKeyOf(e) !== key) return;
      var ms = entryMs(e);
      if (ms && (!best || ms > best.epoch)) best = { epoch: ms, detail: e['[Diaper] Type'] || '' };
    });
    return best;
  }

  function todayDiaperCounts(){
    var start = new Date(); start.setHours(0, 0, 0, 0);
    var s = start.getTime(), c = { n: 0, wet: 0, dirty: 0 };
    getCache().forEach(function(e){
      if (e['Type'] !== 'Diaper' || entryMs(e) < s) return;
      var t = e['[Diaper] Type'];
      c.n++;
      if (t === 'Wet' || t === 'Dirty Wet') c.wet++;
      if (t === 'Dirty' || t === 'Dirty Wet') c.dirty++;
    });
    return c;
  }

  function diaperHintHtml(){
    var last = lastOf('Diaper');
    if (!last) return 'Tap to log';
    var what = last.detail === 'Dirty Wet' ? 'wet + dirty' : String(last.detail || '').toLowerCase();
    var c = todayDiaperCounts();
    return 'Last ' + formatRelative(last.epoch) + (what ? ' \u00b7 ' + what : '') + '<br>' +
      (c.n ? 'Today ' + c.wet + ' wet \u00b7 ' + c.dirty + ' dirty' : 'None today yet');
  }

  function bathHintHtml(){
    var last = lastOf('Bath');
    return last ? 'Last bath ' + formatRelative(last.epoch) : 'Tap to log';
  }

  function tickHints(){
    var d = document.getElementById('diaperHint');
    if (d) d.innerHTML = diaperHintHtml();
    var b = document.getElementById('bathHint');
    if (b) b.innerHTML = bathHintHtml();
  }

  function applyLast(map){
    setLastSeen(map || {});
    tickHints();
  }

  // Ask the backend for growth/temperature rows and per-type last-logged times.
  // If the deployed script predates those actions, fall back to one scan of
  // recent rows.
  function getJson(path){
    return fetch(CONFIG.APPS_SCRIPT_URL + path).then(function(r){ return r.json(); }).catch(function(){ return null; });
  }
  function fetchDerived(){
    if (!configured) return;
    Promise.all([getJson('?action=growth'), getJson('?action=last')]).then(function(rs){
      var g = rs[0], l = rs[1];
      var gOk = !!(g && g.ok && g.entries), lOk = !!(l && l.ok && l.last);
      if (gOk) applyGrowthEntries(g.entries);
      if (lOk) applyLast(l.last);
      if (gOk && lOk) return;
      return getJson('?action=recent&limit=500').then(function(h){
        if (!h || !h.ok) return;
        if (!gOk) applyGrowthEntries(h.entries);
        if (!lOk) applyLast(deriveLast(h.entries));
      });
    });
  }

  function hasGrowthValue(d){
    var w = numOrNull(d.weight), h = numOrNull(d.height), t = numOrNull(d.temp);
    if (d.type === 'Growth') return w !== null || h !== null;
    if (d.type === 'Temperature') return t !== null;
    return w !== null || h !== null || t !== null;
  }

  function refreshGrowthSave(){
    if (!editing || ['Growth', 'Temperature', 'GrowthTemp'].indexOf(editing.type) === -1) return;
    var btn = document.querySelector('.row-active [data-action="save-entry"], .entry-editing [data-action="save-entry"]');

  // Today keeps the current time; a past date is stamped at noon; an unchanged
  // date on an existing entry keeps its original timestamp.
  function growthStartMs(d){
    if (!d.dateStr) return d.startMs;
    if (d.mode === 'edit' && d.dateStr === toDateInputValue(d.startMs)) return d.startMs;
    if (d.dateStr === toDateInputValue(Date.now())) return Date.now();
    var p = d.dateStr.split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2], 12, 0, 0).getTime();
  }

  function saveGrowthTemp(){
    var d = editing;
    if (!d || !hasGrowthValue(d)) return;
    var startMs = growthStartMs(d);
    var note = d.note || '';
    var made = [];
    if (numOrNull(d.weight) !== null || numOrNull(d.height) !== null){
      made.push(buildPayloadFromEditing({ type: 'Growth', startMs: startMs, note: note,
        weight: d.weight, weightUnit: d.weightUnit, height: d.height, heightUnit: d.heightUnit }));
      note = '';
    }
    if (numOrNull(d.temp) !== null){
      made.push(buildPayloadFromEditing({ type: 'Temperature', startMs: startMs, note: note,
        temp: d.temp, tempUnit: d.tempUnit }));
    }
    made.forEach(function(p){
      p['_activityKey'] = uid(); p['_familyKey'] = 'local'; p['_profileKey'] = 'local';
      addCacheEntry(p);
      growthCacheUpsert(p);
      queueOp(p);
    });
    setUnitPrefs({ weight: normUnit(d.weightUnit) || 'LB', height: normUnit(d.heightUnit) || 'IN', temp: normUnit(d.tempUnit) || 'F' });
    editing = null;
    renderRows(); renderRecent(); renderGrowthChart();
  }

  // ---------- Growth chart (inline SVG, no external library) ----------
  var METRIC_LABEL = { weight: 'Weight', height: 'Height', temp: 'Temp' };

  function renderGrowthChart(){
    var tabs = document.getElementById('chartMetricTabs');
    var sysEl = document.getElementById('chartSystemToggle');
    var wrap = document.getElementById('growthChartWrap');
    var latest = document.getElementById('growthLatest');
    if (!tabs || !sysEl || !wrap || !latest) return;

    tabs.innerHTML = ['weight', 'height', 'temp'].map(function(m){
      return '<button class="chip-btn' + (chartPrefs.metric === m ? ' active' : '') + '" data-chart-metric="' + m + '">' + METRIC_LABEL[m] + '</button>';
    }).join('');
    sysEl.innerHTML = [['imperial', 'lbs / in'], ['metric', 'kg / cm']].map(function(s){
      return '<button class="chip-btn' + (chartPrefs.system === s[0] ? ' active' : '') + '" data-chart-system="' + s[0] + '">' + s[1] + '</button>';
    }).join('');

    var metric = chartPrefs.metric, system = chartPrefs.system;
    var unit = UNIT_LABEL[chartTarget(metric, system)];
    var pts = growthSeries(metric, system);
    if (!pts.length){
      wrap.innerHTML = '<div style="padding:28px 8px; text-align:center; opacity:0.7; font-size:0.9rem;">No ' + METRIC_LABEL[metric].toLowerCase() + ' entries yet.</div>';
      latest.textContent = '';
      return;
    }

    var W = 340, H = 210, padL = 40, padR = 14, padT = 14, padB = 26;
    var minX = pts[0].epoch, maxX = pts[pts.length - 1].epoch;
    if (minX === maxX){ minX -= 3 * 86400000; maxX += 3 * 86400000; }
    var vals = pts.map(function(p){ return p.v; });
    var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
    var span = maxV - minV;
    if (span < 0.0001) span = Math.max(1, Math.abs(maxV) * 0.1);
    var lo = minV - span * 0.25, hi = maxV + span * 0.25;
    function X(t){ return padL + (t - minX) / (maxX - minX) * (W - padL - padR); }
    function Y(v){ return padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB); }

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:auto; display:block;" role="img" aria-label="' + METRIC_LABEL[metric] + ' over time">';
    for (var i = 0; i <= 3; i++){
      var gv = lo + (hi - lo) * i / 3, gy = Y(gv);
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '" stroke="currentColor" stroke-opacity="0.12"/>';
      svg += '<text x="' + (padL - 6) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end" font-size="10" fill="currentColor" fill-opacity="0.6">' + fmtVal(gv) + '</text>';
    }
    if (pts.length > 1){
      svg += '<polyline fill="none" style="stroke:var(--rose-deep,#a35252)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' +
        pts.map(function(p){ return X(p.epoch).toFixed(1) + ',' + Y(p.v).toFixed(1); }).join(' ') + '"/>';
    }
    pts.forEach(function(p, idx){
      var cx = X(p.epoch), cy = Y(p.v);
      svg += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3.5" style="fill:var(--rose-deep,#a35252)"/>';
      if (pts.length <= 8 || idx === pts.length - 1){
        svg += '<text x="' + cx.toFixed(1) + '" y="' + (cy - 9).toFixed(1) + '" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity="0.85">' + fmtVal(p.v) + '</text>';
      }
    });
    var yBase = H - 8;
    if (pts.length === 1){
      svg += '<text x="' + X(pts[0].epoch).toFixed(1) + '" y="' + yBase + '" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity="0.6">' + shortDate(pts[0].epoch) + '</text>';
    } else {
      svg += '<text x="' + padL + '" y="' + yBase + '" text-anchor="start" font-size="10" fill="currentColor" fill-opacity="0.6">' + shortDate(pts[0].epoch) + '</text>';
      svg += '<text x="' + (W - padR) + '" y="' + yBase + '" text-anchor="end" font-size="10" fill="currentColor" fill-opacity="0.6">' + shortDate(pts[pts.length - 1].epoch) + '</text>';
    }
    svg += '</svg>';
    wrap.innerHTML = svg;

    var last = pts[pts.length - 1];
    var text = 'Latest: ' + fmtVal(last.v) + ' ' + unit + ' \u00b7 ' + shortDate(last.epoch);
    if (pts.length > 1){
      var prev = pts[pts.length - 2];
      var diff = last.v - prev.v;
      text += ' (' + (diff >= 0 ? '+' : '\u2212') + fmtVal(Math.abs(diff)) + ' since ' + shortDate(prev.epoch) + ')';
    }
    latest.textContent = text;
  }

  // ---------- Networking ----------
  function queueOp(payload){
    var pending = getPending();
    pending.push(payload);
    setPending(pending);
    flushPending();
  }

  var flushing = false;
  function flushPending(){
    if (!configured || flushing) return;
    var pending = getPending();
    if (pending.length === 0) { updateSyncNote(); return; }
    var next = pending[0];
    flushing = true;
    fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(next)
    }).then(function(r){ return r.json(); }).then(function(res){
      flushing = false;
      if (res && (res.ok || res.error === 'not found')){
        // drop the op we just sent, keeping anything queued while it was in flight
        setPending(getPending().slice(1));
        updateSyncNote();
        if (getPending().length > 0) flushPending();
        else { fetchSummary(); fetchDerived(); }
      } else {
        updateSyncNote();
      }
    }).catch(function(){ flushing = false; updateSyncNote(); });
  }

  function updateSyncNote(){
    var pending = getPending();
    var el = document.getElementById('syncNote');
    if (!configured || pending.length === 0){ el.textContent = ''; }
    else { el.textContent = pending.length + ' entr' + (pending.length === 1 ? 'y' : 'ies') + ' waiting to sync\u2026'; }
  }

  function fetchRecent(){
    if (!configured) return;
    fetch(CONFIG.APPS_SCRIPT_URL + '?action=recent&limit=60')
      .then(function(r){ return r.json(); })
      .then(function(res){ if (res && res.ok){ setCache(res.entries); renderRecent(); renderRows(); } })
      .catch(function(){});
  }

  function fetchSummary(){
    if (!configured) return;
    fetch(CONFIG.APPS_SCRIPT_URL + '?action=summary&range=' + currentSummaryRange)
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (res && res.ok){
          localStorage.setItem('jujube_summary_' + currentSummaryRange, JSON.stringify(res.summary));
          renderSummary(res.summary);
        }
      }).catch(function(){});
  }

  // ---------- Medicine ----------
  function getCurrentMed(){ try { return JSON.parse(localStorage.getItem('jujube_current_med')) || null; } catch(e){ return null; } }
  function setCurrentMed(m){ localStorage.setItem('jujube_current_med', JSON.stringify(m)); }

  function getLastDose(){
    var cache = getCache();
    for (var i=0;i<cache.length;i++){
      if (cache[i]['Type'] === 'Medical' && cache[i]['[Medical] Medication']){
        return Number(cache[i]['Start Date/time (Epoch)']) || Date.parse(cache[i]['Start Date/time']);
      }
    }
    return null;
  }

  function doseStatusText(med, lastDoseMs){
    if (!lastDoseMs) return 'No doses logged yet';
    var nextDue = lastDoseMs + med.intervalHours*3600000;
    var diff = nextDue - Date.now();
    if (diff <= 0) return 'Due now' + (Math.abs(diff) > 60000 ? ' \u00b7 overdue ' + formatDuration(Math.abs(diff)/1000) : '');
    return 'Next dose in ' + formatDuration(diff/1000);
  }

        '<div class="row-label" style="font-weight:600;">Medicine Setup</div>' +

          '<div class="actions-right">' +

  function saveMedConfig(){
    if (!editing || editing.mode !== 'config') return;
    setCurrentMed({ name: editing.name || '', intervalHours: Number(editing.intervalHours) || 6 });
    editing = null;
    renderRows();
  }

  // ---------- Rendering: recent ----------
  function renderRecent(){
    var cache = getCache();
    var panel = document.getElementById('recentPanel');
    if (cache.length === 0){ panel.innerHTML = '<div style="padding:16px; text-align:center; opacity:0.7;">Nothing logged yet.</div>'; return; }
    panel.innerHTML = cache.slice(0, 25).map(entryRowHtml).join('');
  }

  function entryRowHtml(e){
    var key = e['_activityKey'];
    if (editing && editing.mode === 'edit' && editing.activityKey === key){
      return '<div class="entry-editing" style="padding:12px 0;">' + renderEntryForm(editing) + '</div>';
    }

    var type = e['Type'];
    var text = type, detail = '';
    var startMs = Number(e['Start Date/time (Epoch)']) || Date.parse(e['Start Date/time']);
    var displayTimeMs = startMs;

    if (type === 'Sleep'){
      text = 'Sleep';
      var dur = Number(e['[Sleep] Duration (Seconds)'])||0;
      var endMs = Number(e['[Sleep] End Date/time (Epoch)']) || (startMs + dur*1000);
      displayTimeMs = endMs;
      detail = 'Woke up at ' + formatTimeOnly(endMs) + ' (' + formatDuration(dur) + ')';
    } else if (type === 'Breastfeed'){
      text = 'Breastfeed';
      var l = Number(e['[Breastfeed] Left Duration (Seconds)'])||0;
      var r = Number(e['[Breastfeed] Right Duration (Seconds)'])||0;
      var parts = [];
      if (l) parts.push('L ' + formatDuration(l));
      if (r) parts.push('R ' + formatDuration(r));
      detail = parts.join(' \u00b7 ');
    } else if (type === 'Bottlefeed' || type === 'Formula' || type === 'Bottle' || type === 'Bottle Feed'){
      text = 'Bottlefeed';
      var mType = e['[Bottle Feed] Type'] || e['[Bottle] Milk Type'] || 'Milk';
      var oz = e['[Bottle Feed] Volume'] || e['[Bottle] Amount (oz)'];
      detail = mType + (oz ? ' \u00b7 ' + oz + ' oz' : '');
    } else if (type === 'Diaper'){
      text = 'Diaper';
      detail = e['[Diaper] Type'] || '';
    } else if (type === 'Routine' && e['[Routine] Routine'] === 'Bath'){
      text = 'Bath';
    } else if (type === 'Medical' && !e['[Medical] Medication'] && numOrNull(e['[Medical] Temperature']) !== null){
      text = 'Temperature';
      detail = fmtField(e['[Medical] Temperature']) + ' ' + (UNIT_LABEL[normUnit(e['[Medical] Temperature Unit']) || 'F'] || '');
    } else if (type === 'Medical'){
      text = 'Medicine';
      detail = e['[Medical] Medication'] || '';
    } else if (type === 'Growth'){
      text = 'Growth';
      var gp = [];
      if (numOrNull(e['[Growth] Weight']) !== null) gp.push(fmtField(e['[Growth] Weight']) + ' ' + (UNIT_LABEL[normUnit(e['[Growth] Weight Unit']) || 'LB'] || ''));
      if (numOrNull(e['[Growth] Height']) !== null) gp.push(fmtField(e['[Growth] Height']) + ' ' + (UNIT_LABEL[normUnit(e['[Growth] Height Unit']) || 'IN'] || ''));
      detail = gp.join(' \u00b7 ');
    }
    if (e['Note']) detail = detail ? detail + ' \u00b7 ' + e['Note'] : e['Note'];

    return '<div class="entry" data-key="' + key + '" style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--paper-line, #e3d9c4); cursor:pointer;">' +
      '<div class="entry-main">' +
      '<div><div class="entry-text" style="font-weight:600;">' + text + '</div>' +
      (detail ? '<div class="entry-detail" style="font-size:0.85rem; opacity:0.7;">' + escapeHtml(detail) + '</div>' : '') +
      '</div></div>' +
      '<div class="entry-right" style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">' +
        '<div class="entry-time" style="font-size:0.8rem; opacity:0.8;">' + formatRelative(displayTimeMs) + '</div>' +
        '<button class="btn" style="font-size:0.75rem; color:var(--coral, #c97a52); border:none; background:none; padding:0;" data-action="quick-delete" data-key="' + key + '">delete</button>' +
      '</div>' +
    '</div>';
  }

  // ---------- Rendering: summary ----------
  function summaryLine(label, count, detail){
    return '<div class="summary-row" style="display:flex; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--paper-line, #e3d9c4);">' +
      '<div class="entry-main"><div><div class="entry-text" style="font-weight:600;">' + label + ' <span style="font-size:0.8rem; opacity:0.8;">(' + count + ')</span></div>' +
      (detail ? '<div class="entry-detail" style="font-size:0.85rem; opacity:0.7;">' + detail + '</div>' : '') + '</div></div></div>';
  }

  function renderSummary(summary){
    var el = document.getElementById('summaryBody');
    var bathCount = (summary && summary.bath) ? summary.bath.count : 0;
    var medCount = (summary && summary.medical) ? summary.medical.count : 0;
    if (!summary || (summary.sleep.count===0 && summary.breastfeed.count===0 && summary.diaper.count===0 && bathCount===0 && medCount===0)){
      el.innerHTML = '<div style="padding:16px; text-align:center; opacity:0.7;">Nothing logged in this window yet.</div>';
      return;
    }
    var rows = [];
    if (summary.sleep.count>0) rows.push(summaryLine('Sleep', summary.sleep.count, formatDuration(summary.sleep.totalSeconds) + ' total sleep'));
    if (summary.breastfeed.count>0) rows.push(summaryLine('Breastfeed', summary.breastfeed.count,
      formatDuration(summary.breastfeed.totalSeconds) + ' total \u00b7 L ' + formatDuration(summary.breastfeed.leftSeconds) + ' \u00b7 R ' + formatDuration(summary.breastfeed.rightSeconds)));
    if (summary.diaper.count>0) rows.push(summaryLine('Diaper', summary.diaper.count, summary.diaper.wet + ' wet \u00b7 ' + summary.diaper.dirty + ' dirty'));
    if (bathCount>0) rows.push(summaryLine('Bath', bathCount, ''));
    if (medCount>0) rows.push(summaryLine('Medicine', medCount, ''));
    el.innerHTML = rows.join('');
  }

  // ---------- Timer actions ----------
  function startSleep(customStartMs){
    var timers = getTimers();
    timers.Sleep = { startedAt: customStartMs || Date.now() };
    setTimers(timers);
    renderSleepRow();
  }

  function stopSleep(){
    var timers = getTimers();
    var t = timers.Sleep;
    if (!t) return;
    var endedAt = Date.now();
    timers.Sleep = null;
    setTimers(timers);
    editing = { mode: 'new', reviewing: true, type: 'Sleep', activityKey: null,
      startMs: t.startedAt, endMs: endedAt, note: '' };
    renderRows();
  }

  function setSleepStartLive(value){
    var timers = getTimers();
    if (!timers.Sleep) return;
    timers.Sleep.startedAt = fromLocalInputValue(value);
    setTimers(timers);
    tickSleep();
  }

  function startFeed(side){
    var timers = getTimers();
    timers.Breastfeed = { startedAt: Date.now(), beginSide: side, currentSide: side, currentSideStart: Date.now(), leftSeconds:0, rightSeconds:0 };
    setTimers(timers);
    renderFeedRow();
  }

  function switchSide(newSide){
    var timers = getTimers();
    var t = timers.Breastfeed;
    if (!t) return;
    var elapsed = (Date.now() - t.currentSideStart)/1000;
    if (t.currentSide === 'LEFT') t.leftSeconds += elapsed; else t.rightSeconds += elapsed;
    t.currentSide = newSide;
    t.currentSideStart = Date.now();
    setTimers(timers);
    renderFeedRow();
  }

  function stopFeed(){
    var timers = getTimers();
    var t = timers.Breastfeed;
    if (!t) return;
    var elapsed = (Date.now() - t.currentSideStart)/1000;
    if (t.currentSide === 'LEFT') t.leftSeconds += elapsed; else t.rightSeconds += elapsed;
    timers.Breastfeed = null;
    setTimers(timers);
    editing = { mode: 'new', reviewing: true, type: 'Breastfeed', activityKey: null,
      startMs: t.startedAt, beginSide: t.beginSide, endSide: t.currentSide,
      leftMin: Math.round(t.leftSeconds/60), rightMin: Math.round(t.rightSeconds/60), note: '' };
    renderRows();
  }

  function setFeedStartLive(value){
    var timers = getTimers();
    var t = timers.Breastfeed;
    if (!t) return;
    var newStart = fromLocalInputValue(value);
    var delta = newStart - t.startedAt;
    t.startedAt = newStart;
    t.currentSideStart += delta;
    setTimers(timers);
    tickFeed();
  }

  // ---------- Manual add / edit / delete ----------
  function openNew(type){
    var now = Date.now();
    editing = { mode: 'new', type: type, activityKey: null, note: '' };
    if (type === 'Sleep'){
      editing.startMs = now - 15*60000; editing.endMs = now; editing.ongoing = false;
    } else if (type === 'Breastfeed'){
      editing.startMs = now - 10*60000;
      editing.beginSide = 'LEFT'; editing.endSide = 'LEFT';
      editing.leftMin = 10; editing.rightMin = 0;
    } else if (type === 'Bottlefeed'){
      editing.startMs = now;
      editing.milkType = 'Breast Milk'; editing.amountOz = ''; editing.amountMl = '';
    } else if (type === 'Diaper'){
      editing.startMs = now;
      editing.diaperType = null; editing.color = null; editing.texture = null; editing.size = null;
    } else if (type === 'Bath' || type === 'Medicine'){
      editing.startMs = now;
    } else if (type === 'GrowthTemp'){
      var up = getUnitPrefs();
      editing.startMs = now; editing.dateStr = toDateInputValue(now);
      editing.weight = ''; editing.height = ''; editing.temp = '';
      editing.weightUnit = up.weight; editing.heightUnit = up.height; editing.tempUnit = up.temp;
    }
    renderRows();
  }

  function openEdit(entry){
    var rawType = entry['Type'];
    var type = rawType;
    if (rawType === 'Routine' && entry['[Routine] Routine'] === 'Bath') type = 'Bath';
    else if (rawType === 'Medical') type = (!entry['[Medical] Medication'] && numOrNull(entry['[Medical] Temperature']) !== null) ? 'Temperature' : 'Medicine';
    else if (rawType === 'Bottlefeed' || rawType === 'Formula' || rawType === 'Bottle' || rawType === 'Bottle Feed') type = 'Bottlefeed';
    var startMs = Number(entry['Start Date/time (Epoch)']) || Date.parse(entry['Start Date/time']);
    editing = { mode: 'edit', type: type, activityKey: entry['_activityKey'], note: entry['Note']||'', startMs: startMs };
    if (type === 'Sleep'){
      editing.endMs = Number(entry['[Sleep] End Date/time (Epoch)']) || (startMs + (Number(entry['[Sleep] Duration (Seconds)'])||0)*1000);
      editing.ongoing = false;
    } else if (type === 'Breastfeed'){
      editing.beginSide = entry['[Breastfeed] Begin Side'] || 'LEFT';
      editing.endSide = entry['[Breastfeed] End Side'] || editing.beginSide;
      editing.leftMin = Math.round((Number(entry['[Breastfeed] Left Duration (Seconds)'])||0)/60);
      editing.rightMin = Math.round((Number(entry['[Breastfeed] Right Duration (Seconds)'])||0)/60);
    } else if (type === 'Bottlefeed'){
      editing.milkType = entry['[Bottle Feed] Type'] || 'Breast Milk';
      editing.amountOz = entry['[Bottle Feed] Volume'] || '';
      if (editing.amountOz !== '') editing.amountMl = Math.round(parseFloat(editing.amountOz) * 29.5735);
    } else if (type === 'Diaper'){
      editing.diaperType = entry['[Diaper] Type'] || null;
      editing.color = entry['[Diaper] Dirty Color'] || null;
      editing.texture = entry['[Diaper] Dirty Texture'] || null;
      editing.size = entry['[Diaper] Detail'] || null;
    } else if (type === 'Medicine'){
      editing.medName = entry['[Medical] Medication'] || '';
    } else if (type === 'Growth'){
      editing.dateStr = toDateInputValue(startMs);
      editing.weight = fmtField(entry['[Growth] Weight']);
      editing.weightUnit = normUnit(entry['[Growth] Weight Unit']) || 'LB';
      editing.height = fmtField(entry['[Growth] Height']);
      editing.heightUnit = normUnit(entry['[Growth] Height Unit']) || 'IN';
    } else if (type === 'Temperature'){
      editing.dateStr = toDateInputValue(startMs);
      editing.temp = fmtField(entry['[Medical] Temperature']);
      editing.tempUnit = normUnit(entry['[Medical] Temperature Unit']) || 'F';
    }
    renderRecent();
  }

  function cancelEdit(){
    editing = null;
    renderRows(); renderRecent();
  }

  // Maps strictly to existing backend Nara headers
  function buildPayloadFromEditing(d){
    var base = {
      "Type": d.type, "Profile Name": CONFIG.PROFILE_NAME,
      "Start Date/time": formatDateTime(d.startMs), "Start Date/time (Epoch)": d.startMs,
      "Created By Caregiver": CONFIG.CAREGIVER, "Last Updated By Caregiver": CONFIG.CAREGIVER,
      "Time Zone": CONFIG.TIMEZONE, "Note": d.note || ""
    };
    if (d.type === 'Sleep'){
      base["[Sleep] Duration (Seconds)"] = Math.max(0, Math.round((d.endMs - d.startMs)/1000));
      base["[Sleep] End Date/time"] = formatDateTime(d.endMs);
      base["[Sleep] End Date/time (Epoch)"] = d.endMs;
    } else if (d.type === 'Breastfeed'){
      base["[Breastfeed] Begin Side"] = d.beginSide;
      base["[Breastfeed] End Side"] = d.endSide;
      base["[Breastfeed] Left Duration (Seconds)"] = Math.max(0, Math.round((Number(d.leftMin)||0)*60));
      base["[Breastfeed] Right Duration (Seconds)"] = Math.max(0, Math.round((Number(d.rightMin)||0)*60));
    } else if (d.type === 'Bottlefeed'){
      base["Type"] = "Bottle Feed";
      base["[Bottle Feed] Type"] = d.milkType || "Breast Milk";
      base["[Bottle Feed] Volume"] = d.amountOz || "";
      base["[Bottle Feed] Volume Unit"] = "oz";
      if (d.milkType === 'Formula') {
        base["[Bottle Feed] Formula Volume"] = d.amountOz || "";
        base["[Bottle Feed] Formula Volume Unit"] = "oz";
      } else {
        base["[Bottle Feed] Breast Milk Volume"] = d.amountOz || "";
        base["[Bottle Feed] Breast Milk Volume Unit"] = "oz";
      }
    } else if (d.type === 'Diaper'){
      base["[Diaper] Type"] = d.diaperType;
      base["[Diaper] Dirty Color"] = d.color || "";
      base["[Diaper] Dirty Texture"] = d.texture || "";
      base["[Diaper] Detail"] = d.size || "";
    } else if (d.type === 'Bath'){
      base["Type"] = "Routine";
      base["[Routine] Routine"] = "Bath";
    } else if (d.type === 'Medicine'){
      base["Type"] = "Medical";
      var med = getCurrentMed();
      base["[Medical] Medication"] = (d.mode === 'edit' ? d.medName : (med ? med.name : '')) || '';
    } else if (d.type === 'Growth'){
      var wv = numOrNull(d.weight), hv = numOrNull(d.height);
      base["[Growth] Weight"] = wv === null ? "" : wv;
      base["[Growth] Weight Unit"] = wv === null ? "" : normUnit(d.weightUnit);
      base["[Growth] Height"] = hv === null ? "" : hv;
      base["[Growth] Height Unit"] = hv === null ? "" : normUnit(d.heightUnit);
    } else if (d.type === 'Temperature'){
      base["Type"] = "Medical";
      var tv = numOrNull(d.temp);
      base["[Medical] Temperature"] = tv === null ? "" : tv;
      base["[Medical] Temperature Unit"] = tv === null ? "" : normUnit(d.tempUnit);
    }
    return base;
  }

  function saveEntry(){
    if (!editing) return;
    if (editing.type === 'GrowthTemp'){ saveGrowthTemp(); return; }
    if (editing.type === 'Growth' || editing.type === 'Temperature'){
      if (!hasGrowthValue(editing)) return;
      editing.startMs = growthStartMs(editing);
    }
    if (editing.type === 'Sleep' && editing.ongoing) {
      var startMs = editing.startMs;
      editing = null;
      startSleep(startMs);
      return;
    }
    if (editing.type === 'Diaper' && !editing.diaperType) return;
    if (editing.type === 'Bottlefeed' && !editing.milkType) return;
    var payload = buildPayloadFromEditing(editing);
    if (editing.mode === 'edit'){
      payload['_op'] = 'update';
      payload['_activityKey'] = editing.activityKey;
      updateCacheEntry(editing.activityKey, payload);
    } else {
      payload['_activityKey'] = uid();
      payload['_familyKey'] = 'local';
      payload['_profileKey'] = 'local';
      addCacheEntry(payload);
    }
    queueOp(payload);
    growthCacheUpsert(payload);
    editing = null;
    renderRows(); renderRecent(); fetchSummary(); renderGrowthChart();
  }

  function deleteEntry(){
    if (!editing || editing.mode !== 'edit') return;
    if (!confirm('Delete this entry?')) return;
    var key = editing.activityKey;
    queueOp({ _op: 'delete', _activityKey: key });
    removeCacheEntry(key);
    growthCacheRemove(key);
    editing = null;
    renderRows(); renderRecent(); fetchSummary(); renderGrowthChart();
  }

  // ---------- Ticking ----------
  function tickSleep(){
    var t = getTimers().Sleep;
    var el = document.getElementById('sleepTimerText');
    if (t && el) el.textContent = formatElapsed((Date.now()-t.startedAt)/1000);
  }
  function tickFeed(){
    var t = getTimers().Breastfeed;
    var elText = document.getElementById('feedTimerText');
    var elSub = document.getElementById('feedSubText');
    if (t && elText){
      var currentElapsed = (Date.now() - t.currentSideStart)/1000;
      elText.textContent = formatElapsed(currentElapsed);
      if (elSub) elSub.textContent = feedSubLabel(t);
    }
  }

  function tickMed(){
    if (editing && editing.type === 'Medicine') return;
    var med = getCurrentMed();
    if (!med || !med.name) return;
    var el = document.getElementById('doseStatusText');
    if (el) el.textContent = doseStatusText(med, getLastDose());
  }

  // ---------- Event wiring ----------
  document.addEventListener('click', function(e){
    var chartMetric = e.target.closest('[data-chart-metric]');
    if (chartMetric){ chartPrefs.metric = chartMetric.dataset.chartMetric; saveChartPrefs(); renderGrowthChart(); return; }
    var chartSystem = e.target.closest('[data-chart-system]');
    if (chartSystem){ chartPrefs.system = chartSystem.dataset.chartSystem; saveChartPrefs(); renderGrowthChart(); renderGrowthRow(); return; }
    var groupChip = e.target.closest('[data-group]');
    if (groupChip && editing){
      var group = groupChip.dataset.group, value = groupChip.dataset.value;
      editing[group] = (editing[group] === value) ? null : value;
      if (editing.mode === 'new') renderRows(); else renderRecent();
      return;
    }
    var sideChipEl = e.target.closest('[data-side-field]');
    if (sideChipEl && editing){
      editing[sideChipEl.dataset.sideField] = sideChipEl.dataset.sideValue;
      if (editing.mode === 'new') renderRows(); else renderRecent();
      return;
    }
    var tab = e.target.closest('.tab-btn');
    if (tab){
      currentSummaryRange = tab.dataset.range;
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b===tab); });
      var cached = localStorage.getItem('jujube_summary_' + currentSummaryRange);
      if (cached) renderSummary(JSON.parse(cached));
      fetchSummary();
      return;
    }
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === 'start-sleep') startSleep();
    else if (action === 'stop-sleep') stopSleep();
    else if (action === 'start-feed') startFeed(btn.dataset.side);
    else if (action === 'switch-side') switchSide(btn.dataset.side);
    else if (action === 'stop-feed') stopFeed();
    else if (action === 'open-new') openNew(btn.dataset.type);
    else if (action === 'open-med-config'){
      var currentMed = getCurrentMed() || { name:'', intervalHours:6 };
      editing = { mode:'config', type:'Medicine', name: currentMed.name, intervalHours: currentMed.intervalHours };
      renderRows();
    }
    else if (action === 'save-med-config') saveMedConfig();
    else if (action === 'cancel-edit') cancelEdit();
    else if (action === 'save-entry') saveEntry();
    else if (action === 'delete-entry') deleteEntry();
    else if (action === 'quick-delete'){
      var qkey = btn.dataset.key;
      if (confirm('Delete this entry?')){
        queueOp({ _op: 'delete', _activityKey: qkey });
        removeCacheEntry(qkey);
        growthCacheRemove(qkey);
        if (editing && editing.activityKey === qkey) editing = null;
        renderRecent(); renderRows(); fetchSummary(); renderGrowthChart();
      }
    }
  });

  document.addEventListener('change', function(e){
    if (e.target && e.target.dataset && e.target.dataset.action === 'toggle-sleep-ongoing') {
      if (editing && editing.type === 'Sleep') {
        editing.ongoing = e.target.checked;
        renderRows();
      }
    }
  });

  document.addEventListener('dblclick', function(e){
    var row = e.target.closest('.entry');
    if (!row) return;
    var key = row.dataset.key;
    if (!key) return;
    var entry = getCache().filter(function(x){ return x['_activityKey']===key; })[0];
    if (entry) openEdit(entry);
  });

  function onEditFieldChange(e){
    var field = e.target.dataset && e.target.dataset.edit;
    if (field && editing){
      if (field === 'startMs' || field === 'endMs') {
        editing[field] = fromLocalInputValue(e.target.value);
      } else if (field === 'amountOz') {
        editing.amountOz = e.target.value;
        if (e.target.value !== '') editing.amountMl = Math.round(parseFloat(e.target.value) * 29.5735);
        if (editing.type === 'Bottlefeed') renderRows();
      } else if (field === 'amountMl') {
        editing.amountMl = e.target.value;
        if (e.target.value !== '') editing.amountOz = (parseFloat(e.target.value) / 29.5735).toFixed(1);
        if (editing.type === 'Bottlefeed') renderRows();
      } else {
        editing[field] = e.target.value;
        if (field === 'weight' || field === 'height' || field === 'temp') refreshGrowthSave();
      }
      return;
    }
    var live = e.target.dataset && e.target.dataset.editLive;
    if (live === 'sleep-start') setSleepStartLive(e.target.value);
    else if (live === 'feed-start') setFeedStartLive(e.target.value);
  }
  document.addEventListener('change', onEditFieldChange);
  document.addEventListener('input', function(e){
    var field = e.target.dataset && e.target.dataset.edit;
    if (field === 'note' || field === 'leftMin' || field === 'rightMin' || field === 'name' || field === 'intervalHours' || field === 'amountOz' || field === 'amountMl' || field === 'weight' || field === 'height' || field === 'temp') onEditFieldChange(e);
  });

  window.addEventListener('online', flushPending);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible'){
      renderRows(); flushPending(); fetchRecent(); fetchSummary(); fetchDerived();
    }
  });

  // ---------- Init ----------
  document.getElementById('age').textContent = computeAge(CONFIG.BIRTH_DATE);
  renderRecent();
  renderRows();
  renderGrowthChart();
  fetchRecent();
  fetchSummary();
  fetchDerived();
  updateSyncNote();
  flushPending();
  setInterval(function(){ tickSleep(); tickFeed(); tickMed(); tickHints(); }, 1000);

})();
</script>
</body>
</html>
